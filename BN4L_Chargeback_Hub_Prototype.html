<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>BN4L Chargeback Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --ink:#172033; --muted:#5A6477; --faint:#8A94A6;
  --line:#DCE2EB; --line-soft:#E9EDF3;
  --accent:#0B63CE; --accent-ink:#FFFFFF; --accent-soft:#E7F0FB; --accent-text:#0A58B8;
  --good:#1B7F4F; --good-soft:#E3F3EA; --warn:#9A6200; --warn-soft:#FBF0DA; --crit:#C23A2F; --crit-soft:#FBE7E5;
  --s1:#2a78d6; --s2:#eb6834; --grid:#E6EAF0;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --p-admin:#2a78d6; --p-fin:#4a3aa7; --p-bot:#1baf7a; --p-exec:#eb6834; --p-aud:#52514e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#161D28; --surface-2:#1B2330; --ink:#E7ECF4; --muted:#A1ACBE; --faint:#7A869A;
  --line:#2A3443; --line-soft:#222B38; --accent:#4C95F0; --accent-ink:#0B1422; --accent-soft:#1B2D46; --accent-text:#7FB4F7;
  --good:#4CC38A; --good-soft:#153326; --warn:#E3AE4F; --warn-soft:#3A2D12; --crit:#EF7A70; --crit-soft:#3B1B19;
  --s1:#3987e5; --s2:#d95926; --grid:#253040; --shadow:none;
  --p-admin:#3987e5; --p-fin:#9085e9; --p-bot:#199e70; --p-exec:#d95926; --p-aud:#8b8a84;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1B2330; --ink:#E7ECF4; --muted:#A1ACBE; --faint:#7A869A;
  --line:#2A3443; --line-soft:#222B38; --accent:#4C95F0; --accent-ink:#0B1422; --accent-soft:#1B2D46; --accent-text:#7FB4F7;
  --good:#4CC38A; --good-soft:#153326; --warn:#E3AE4F; --warn-soft:#3A2D12; --crit:#EF7A70; --crit-soft:#3B1B19;
  --s1:#3987e5; --s2:#d95926; --grid:#253040; --shadow:none;
  --p-admin:#3987e5; --p-fin:#9085e9; --p-bot:#199e70; --p-exec:#d95926; --p-aud:#8b8a84;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding-block:10px;padding-inline:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:13px;flex:none}
.brand b{font-weight:600;font-size:15px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface-2);font-size:12.5px}
.persona-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:11.5px;flex:none}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.badge-dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}

.flow{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:16px}
.flow-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.flow-head .eyebrow{color:var(--accent-text)}
.flow-steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fstep{flex:1 0 150px;display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface-2);text-align:left;min-width:150px}
.fstep .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);flex:none;margin-top:1px}
.fstep .t{font-size:12px;font-weight:500;line-height:1.3}
.fstep .w{font-size:11px;color:var(--muted)}
.fstep.done{background:var(--good-soft);border-color:transparent}
.fstep.done .n{background:var(--good);border-color:var(--good);color:#fff}
.fstep.current{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.fstep.current .n{border-color:var(--accent);color:var(--accent-text)}

.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 120px)}
.nav{background:var(--surface);border-right:1px solid var(--line);padding-block:16px;padding-inline:12px;display:flex;flex-direction:column;gap:4px}
.nav .who{padding:4px 8px 12px;border-bottom:1px solid var(--line-soft);margin-bottom:8px}
.nav .who b{display:block;font-size:13.5px}
.nav .who span{font-size:12px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:0 7px;font-weight:600}
.nav .sep{height:1px;background:var(--line-soft);margin:8px 4px}
main{padding-block:20px 48px;padding-inline:24px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{color:var(--muted);margin-top:4px;max-width:70ch}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-b{padding:16px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted)}
.role-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.role-strip>div{padding:12px 16px;border-right:1px solid var(--line-soft)}
.role-strip>div:last-child{border-right:0}
.role-strip ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink)}
.role-strip li{margin-bottom:2px}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
tr.hl td{background:var(--accent-soft)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--accent-soft);color:var(--accent-text)}
.chip.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:15px;height:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hint{font-size:12px;color:var(--muted)}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.check:last-child{border-bottom:0}
.check .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:700}
.check .ic.ok{background:var(--good);color:#fff}
.check .ic.no{border:2px solid var(--line);color:var(--muted)}
.check .ic.bad{background:var(--warn-soft);color:var(--warn)}
.check .body{flex:1;min-width:0}
.check .body b{font-weight:600;font-size:13.5px}
.check .body p{font-size:12.5px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--surface);min-width:0}
.field textarea{min-height:80px;resize:vertical}
select.inline{border:1px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface);max-width:220px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:12px 16px;font-size:13px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.good{background:var(--good-soft)}
.banner.warn{background:var(--warn-soft)}
.banner b{font-weight:600}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{font-family:"IBM Plex Sans",system-ui,sans-serif}
.chart-wrap{width:100%;overflow-x:auto}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 10px;border-radius:7px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.2);line-height:1.4}
#tip b{font-weight:600}

.rep{display:flex;flex-direction:column;gap:10px;padding:16px}
.rep .fmt{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.rep .meta{font-size:12px;color:var(--muted)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}

.drawer-bg{position:fixed;inset:0;background:rgba(10,16,26,.42);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer .db{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.menu{position:absolute;right:0;top:44px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(10,16,26,.18);z-index:30;overflow:hidden}
.menu .mi{display:flex;gap:10px;align-items:center;padding:10px 14px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line-soft)}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi.on{background:var(--accent-soft)}
.menu .mi b{display:block;font-size:13px;font-weight:600}
.menu .mi span{font-size:12px;color:var(--muted)}
.rel{position:relative}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.timeline .ev{position:relative;padding-bottom:12px}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.timeline .ev b{font-size:13px;font-weight:600}
.timeline .ev p{font-size:12px;color:var(--muted)}
.persona-card{display:flex;flex-direction:column}
.persona-card .ph{display:flex;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line-soft)}
.persona-card .ph .avatar{width:44px;height:44px;font-size:15px}
.persona-card .pb{padding:14px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.persona-card .pb ul{margin:4px 0 0;padding-left:16px;font-size:12.5px}
.persona-card .pb li{margin-bottom:2px}
.persona-card .quote{font-style:italic;color:var(--muted);font-size:13px;padding:0 16px 14px}
.matrix td.c{text-align:center}
.yes{color:var(--good);font-weight:700}
.ro{color:var(--accent-text);font-weight:600;font-size:12px}
.no{color:var(--faint)}
.sample-note{font-size:11.5px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 8px}
.bar-track{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;min-width:60px}
.bar-track i{display:block;height:100%;background:var(--s1);border-radius:3px}
.empty{padding:28px;text-align:center;color:var(--muted)}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-inline:16px}
  .nav .who,.nav .sep{display:none}
  .nav a{white-space:nowrap}
  main{padding-inline:16px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .role-strip{grid-template-columns:minmax(0,1fr)}
  .role-strip>div{border-right:0;border-bottom:1px solid var(--line-soft)}
  .persona-card .pb{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
}
@media (max-width:480px){.g4{grid-template-columns:minmax(0,1fr)}.kpi .v{font-size:21px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- domain logic ---------- */
function eventsMissingFactor(){ return S.runs.some(r=>r.status==='Failed' && r.flow.includes('Tracking')) ? 0.968 : 1; }
function volumes(){
  // attributed volume per bottler for the period, plus suspense
  const f = eventsMissingFactor();
  const v = Object.fromEntries(BOTTLERS.map(b=>[b.id,{fo:b.fo,users:b.users,ev:Math.round(b.ev*f),te:b.te}]));
  S.resolved.forEach(s=>{ v[s.assign].fo += s.fo; v[s.assign].ev += Math.round(s.ev*f); v[s.assign].te += s.obj==='Tender'?s.fo:0; });
  const sus = S.suspense.reduce((a,s)=>({fo:a.fo+s.fo,ev:a.ev+s.ev}),{fo:0,ev:0});
  return {v,sus};
}
function totalCost(){ return COST_LINES.reduce((a,c)=>a+c.amt,0); }
function allocate(metric=S.rate.metric, alpha=S.rate.alpha){
  const C = totalCost(), N = BOTTLERS.length, {v,sus} = volumes();
  const U = BOTTLERS.reduce((a,b)=>a+v[b.id][metric],0);
  const fixedEach = C*alpha/N, varPool = C*(1-alpha), ratePer = varPool/U;
  let rows = BOTTLERS.map(b=>{
    const u = v[b.id][metric], fixed = r2(fixedEach), variable = r2(varPool*u/U);
    const credit = S.carriedCredits.filter(c=>c.bottler===b.id).reduce((a,c)=>a+c.amt,0);
    return {id:b.id,name:b.name,region:b.region,usage:u,share:u/U,fixed,variable,total:r2(fixed+variable),credit,fo:v[b.id].fo,users:v[b.id].users,ev:v[b.id].ev,te:v[b.id].te};
  });
  const sum = r2(rows.reduce((a,r)=>a+r.total,0)); const rounding = r2(C - sum);
  if (rounding !== 0){ const big = rows.reduce((m,r)=>r.total>m.total?r:m,rows[0]); big.variable = r2(big.variable+rounding); big.total = r2(big.total+rounding); big.roundAdj = rounding; }
  const prev = histCharges('2026-07');
  rows.forEach(r=>{ r.prev = prev[r.id]; r.delta = r.total - prev[r.id]; r.net = r2(r.total - r.credit); });
  return {rows,C,U,ratePer,fixedEach:r2(fixedEach),varPool,rounding,sus,allocated:r2(rows.reduce((a,r)=>a+r.total,0)),metric,alpha};
}
function histCharges(pid){
  const h = HIST.find(x=>x[0]===pid); const C = h[2]; const idx = HIST.indexOf(h);
  const tot = BOTTLERS.reduce((a,b)=>a+b.fo,0);
  const out = {}; let acc = 0;
  BOTTLERS.forEach((b,i)=>{ seed = 97 + idx*31 + i*13; const w = b.fo/tot*(0.94+rnd()*0.12); out[b.id]=w; acc+=w; });
  BOTTLERS.forEach(b=>{ out[b.id] = r2(C*(0.3/13) + C*0.7*out[b.id]/acc); });
  return out;
}
function attributionRate(){ const {v,sus}=volumes(); const at = BOTTLERS.reduce((a,b)=>a+v[b.id].fo,0); return at/(at+sus.fo); }

function stackedBars(rows){
  const W=1000, rowH=28, top=8, left=240, right=96, H=top+rows.length*rowH+26;
  const max = Math.max(...rows.map(r=>r.fixed+r.variable)); const nice = Math.ceil(max/5000)*5000; const sx = v => (W-left-right)*v/nice;
  let g = '';
  for(let t=0;t<=nice;t+=nice/5){ const x=left+sx(t); g+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${H-22}" stroke="var(--grid)"/><text x="${x}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${t===0?'$0':'$'+(t/1000)+'k'}</text>`; }
  rows.forEach((r,i)=>{
    const y = top + i*rowH + 5, h = rowH-10, wf = sx(r.fixed), wv = sx(r.variable);
    const tipTxt = `<b>${esc(r.name)}</b><br>Fixed share ${usd(r.fixed)}<br>Variable ${usd(r.variable)}<br>Total ${usd(r.total)}`;
    g += `<text x="${left-8}" y="${y+h/2+4}" font-size="11.5" text-anchor="end" fill="var(--ink)">${esc(r.id)} · ${esc(r.name.length>28?r.name.slice(0,27)+'…':r.name)}</text>`;
    g += `<g data-tip="${esc(tipTxt)}"><rect x="${left-2}" y="${y-4}" width="${W-left-right+4}" height="${h+8}" fill="transparent"/>`;
    g += `<rect x="${left}" y="${y}" width="${Math.max(wf-1,0)}" height="${h}" rx="3" fill="var(--s1)"/>`;
    g += `<rect x="${left+wf+1}" y="${y}" width="${Math.max(wv-1,0)}" height="${h}" rx="3" fill="var(--s2)"/></g>`;
    g += `<text x="${left+wf+wv+6}" y="${y+h/2+4}" font-size="11" fill="var(--muted)" class="num">${usd0(r.total)}</text>`;
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:640px" role="img" aria-label="Charge by bottler, fixed and variable">${g}</svg></div>
  <div class="legend" style="margin-top:6px"><span><i style="background:var(--s1)"></i>Fixed platform share</span><span><i style="background:var(--s2)"></i>Variable usage charge</span></div>`;
}
function lineChart(pts, label){
  const W=720,H=230,l=58,r=24,t=16,b=30;
  const vals = pts.map(p=>p.v); const lo = Math.floor(Math.min(...vals)*0.985/1000)*1000, hi = Math.ceil(Math.max(...vals)*1.01/1000)*1000;
  const sx = i => l + (W-l-r)*i/(pts.length-1), sy = v => t + (H-t-b)*(1-(v-lo)/(hi-lo));
  let g=''; const steps=4;
  for(let k=0;k<=steps;k++){ const v=lo+(hi-lo)*k/steps, y=sy(v); g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${l-8}" y="${y+4}" font-size="10.5" text-anchor="end" fill="var(--muted)">$${(v/1000).toFixed(1)}k</text>`; }
  const d = pts.map((p,i)=>(i?'L':'M')+sx(i)+' '+sy(p.v)).join(' ');
  g += `<path d="${d} L${sx(pts.length-1)} ${H-b} L${sx(0)} ${H-b} Z" fill="var(--s1)" opacity=".10"/>`;
  g += `<path d="${d}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{ const last=i===pts.length-1; g+=`<text x="${sx(i)}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${esc(p.l)}</text>`;
    g+=`<g data-tip="<b>${esc(p.l)}</b><br>${esc(label)} ${usd(p.v)}${p.note?'<br>'+esc(p.note):''}"><rect x="${sx(i)-40}" y="${t}" width="80" height="${H-t-b}" fill="transparent"/><circle cx="${sx(i)}" cy="${sy(p.v)}" r="${last?5.5:4}" fill="${last?'var(--s1)':'var(--surface)'}" stroke="var(--s1)" stroke-width="2"/></g>`;
    if(last) g+=`<text x="${sx(i)-8}" y="${sy(p.v)-12}" font-size="11.5" font-weight="600" text-anchor="end" fill="var(--ink)">${usd0(p.v)}</text>`; });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:480px" role="img" aria-label="${esc(label)} trend">${g}</svg></div>`;
}
function dailyBars(days){
  const W=720,H=200,l=44,r=12,t=12,b=28; const max = Math.ceil(Math.max(...days.map(d=>d.v))/100)*100; const bw=(W-l-r)/days.length;
  let g=''; for(let k=0;k<=4;k++){ const v=max*k/4, y=t+(H-t-b)*(1-k/4); g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${l-6}" y="${y+4}" font-size="10.5" text-anchor="end" fill="var(--muted)">${int(v)}</text>`; }
  days.forEach((d,i)=>{ const h=(H-t-b)*d.v/max, x=l+i*bw+2, y=H-b-h; g+=`<g data-tip="<b>${esc(d.l)}</b><br>${int(d.v)} freight orders${d.we?'<br>Weekend':''}"><rect x="${l+i*bw}" y="${t}" width="${bw}" height="${H-t-b}" fill="transparent"/><path d="M${x} ${H-b} V${y+3} q0 -3 3 -3 H${x+bw-7} q3 0 3 3 V${H-b}Z" fill="var(--s1)" opacity="${d.we?.45:1}"/></g>`; if(i%3===0) g+=`<text x="${x+(bw-4)/2}" y="${H-10}" font-size="10.5" text-anchor="middle" fill="var(--muted)">${d.d}</text>`; });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:480px" role="img" aria-label="Daily freight orders">${g}</svg></div>`;
}

let dlApi; const dlReady = (async()=>{ try{ dlApi = window.claude?.use ? await window.claude.use('downloads') : null; }catch(e){ dlApi=null; } })();
async function download(key, fmt){
  if (fmt==='xlsx' && !window.XLSX){ toast('Excel library did not load. Check your connection and reload.'); return; }
  if (fmt==='pdf' && !(window.jspdf && window.jspdf.jsPDF)){ toast('PDF library did not load. Check your connection and reload.'); return; }
  const R = reportData(key); const filename = R.file + '.' + fmt;
  let data; try { data = fmt==='xlsx' ? buildXlsx(R) : buildPdf(R); } catch(e){ console.error(e); toast('Could not build the file: '+e.message); return; }
  const blob = new Blob([data], {type: fmt==='xlsx'?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/pdf'});
  await dlReady;
  if (dlApi){
    try { await dlApi.save({filename, data:blob}); toast('Saved '+filename); log('Statements','Report downloaded',R.title,filename); }
    catch(e){ const c = e&&e.code; toast(c==='declined'?'Download cancelled':c==='rate_limited'?'A save prompt is already open':'Download not available here ('+(c||'error')+')'); }
    return;
  }
  // outside the claude.ai viewer (e.g. file opened locally)
  try { const u = URL.createObjectURL(blob); const aEl = document.createElement('a'); aEl.href=u; aEl.download=filename; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('Downloading '+filename); log('Statements','Report downloaded',R.title,filename); }
  catch(e){ toast('Downloads are not available in this view.'); }
}

  if (d.type==='dispute-view'){
    const x = S.disputes.find(z=>z.id===d.id); const can = S.persona==='fin' && x.status==='Submitted';
    return `<div class="drawer-bg" data-act="close-bg"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="dh"><div><span class="eyebrow">${x.id} · ${x.period}</span><h2 id="dh" style="margin-top:4px">${esc(BMAP[x.bottler].name)}</h2><p class="small muted">${esc(x.line)} · claimed ${usd(x.claimed)}</p></div><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div>
    <div class="db"><div class="row">${chip(x.status)}<span class="small muted">Raised ${x.raised} by ${esc(x.raisedBy)}</span></div>
    <div><span class="eyebrow">Reason</span><p style="margin-top:4px">${esc(x.reason)}</p></div><div><span class="eyebrow">Description</span><p style="margin-top:4px">${esc(x.desc)}</p></div>${x.evidence?`<div><span class="eyebrow">Evidence</span><p class="mono" style="margin-top:4px">${esc(x.evidence)}</p></div>`:''}
    ${x.period==='2026-08'?`<div class="card"><div class="card-b small"><b>Ledger check</b><p class="muted" style="margin-top:4px">690 freight orders in the cited range were created by users in group BN4L_B01_USERS on 18–19 Aug with carrier "TEST CARRIER 01". At ${usd(allocate().ratePer,4)} per order that is ${usd(690*allocate().ratePer)}.</p></div></div>`:''}
    ${can?`<div class="field"><label for="dcredit">Credit to approve (USD)</label><input id="dcredit" type="number" step="0.01" min="0" value="${Math.min(x.claimed, r2(690*allocate().ratePer)).toFixed(2)}"></div><div class="field"><label for="dnote">Decision note (shared with the bottler)</label><textarea id="dnote">Test orders confirmed in the ledger. Added carrier "TEST CARRIER 01" to exclusions from September.</textarea></div>`:
      x.status!=='Submitted'?`<div class="timeline"><div class="ev"><b>Submitted</b><p>${x.raised} · ${esc(x.raisedBy)}</p></div><div class="ev"><b>${x.status}${x.credit?' · credit '+usd(x.credit):''}</b><p>${x.decided} · ${esc(x.decidedBy)}</p></div><div class="ev"><b>Note</b><p>${esc(x.note)}</p></div></div>`:'<p class="muted small">Waiting for CONA finance.</p>'}
    </div>${can?`<div class="df"><button class="btn danger" data-act="decide" data-v="reject">Reject</button><button class="btn primary" data-act="decide" data-v="approve">Approve credit</button></div>`:''}</div></div>`;
  }
  if (d.type==='confirm'){
    return `<div class="drawer-bg" data-act="close-bg"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="dh"><div><h2 id="dh">${esc(d.title)}</h2></div><button class="icon-btn" data-act="close" aria-label="Close">${ICON.close}</button></div><div class="db"><p>${d.body}</p></div><div class="df"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="${d.act}">${esc(d.ok)}</button></div></div></div>`;
  }
  return '';
}

/* ---------- render ---------- */
const PAGES = {overview:pAdminOverview,runs:pRuns,suspense:pSuspense,master:pMaster,exclusions:pExclusions,close:pClose,allocation:pAllocation,rate:pRate,recon:pRecon,disputes:pDisputes,usage:pUsage,statements:pStatements,mydisputes:pMyDisputes,dash:pDash,audit:pAudit,snapshots:pSnapshots,reports:pReports,personas:pPersonas};
function render(){
  if (S.persona==='exec' && S.page==='dash') S.visitedExec = true;
  const P = PERSONAS[S.persona]; const unread = S.notes.filter(n=>n.to===S.persona && !n.read).length;
  const cur = FLOW.findIndex(f=>!f.done()); const doneAll = cur===-1;
  const counts = {suspense:S.suspense.length, runs:S.runs.filter(r=>r.status==='Failed').length, disputes:S.disputes.filter(d=>d.status==='Submitted').length};
  const nav = NAV[S.persona].map(([k,l])=>`<a class="${S.page===k?'on':''}" data-act="go" data-page="${k}" tabindex="0">${esc(l)}${counts[k]?`<span class="cnt">${counts[k]}</span>`:''}</a>`).join('') + `<div class="sep"></div><a class="${S.page==='personas'?'on':''}" data-act="go" data-page="personas" tabindex="0">Personas & access</a>`;
  const scrollY = window.scrollY;
  $('#app').innerHTML = `
  <header class="top">
    <div class="brand"><span class="brand-mark">CB</span><div><b>BN4L Chargeback Hub</b><small>CONA · SAP BTP subaccount cona-chargeback-prd</small></div></div>
    <div class="top-right">
      <span class="period-pill"><span class="muted">Period</span><b>${PERIOD.label}</b>${chip(periodStatus())}</span>
      <div class="rel"><button class="icon-btn" data-act="toggle-notes" aria-label="Notifications">${ICON.bell}${unread?`<span class="badge-dot">${unread}</span>`:''}</button>
        ${S.menu==='notes'?`<div class="menu" role="menu">${S.notes.filter(n=>n.to===S.persona).slice(0,8).map(n=>`<div class="mi" style="display:block"><b style="font-weight:${n.read?400:600}">${esc(n.text)}</b><span>${n.ts}</span></div>`).join('')||'<div class="mi">No notifications</div>'}<button class="mi" data-act="mark-read" style="justify-content:center;color:var(--accent-text)">Mark all as read</button></div>`:''}</div>
      <div class="rel"><button class="persona-btn" data-act="toggle-persona" aria-haspopup="menu"><span class="avatar" style="background:${P.color}">${P.init}</span><span style="text-align:left;line-height:1.2"><b style="font-size:13px;font-weight:600;display:block">${esc(P.name)}</b><span class="small muted">${esc(P.title)}</span></span></button>
        ${S.menu==='persona'?`<div class="menu" role="menu"><div class="mi" style="display:block;background:var(--surface-2)"><span class="eyebrow">Switch persona</span></div>${Object.values(PERSONAS).map(x=>`<button class="mi ${x.key===S.persona?'on':''}" data-act="persona" data-p="${x.key}" role="menuitem"><span class="avatar" style="background:${x.color}">${x.init}</span><span><b>${esc(x.name)}</b><span>${esc(x.title)} · ${esc(x.org)}</span></span></button>`).join('')}<button class="mi" data-act="go" data-page="personas">${ICON.people}<span><b>All personas & access matrix</b></span></button><button class="mi" data-act="reset" style="color:var(--crit)"><span><b>Reset demo data</b><span>Start the August close again</span></span></button></div>`:''}</div>
    </div>
  </header>
  <section class="flow" aria-label="End-to-end flow">
    <div class="flow-head"><span class="eyebrow">End-to-end flow · August close</span><span class="small muted">${doneAll?'All 8 steps complete. Every persona has done their part.':'Step '+(cur+1)+' of 8 · '+esc(PERSONAS[FLOW[cur].p].name)+' ('+esc(PERSONAS[FLOW[cur].p].title)+')'}</span>
    ${!doneAll?`<button class="btn sm primary" data-act="flow" data-i="${cur}" style="margin-left:auto">${S.persona===FLOW[cur].p&&S.page===FLOW[cur].page?'You are here':'Go to step '+(cur+1)} ${ICON.arrow}</button>`:`<button class="btn sm" data-act="reset" style="margin-left:auto">Run it again</button>`}</div>
    <div class="flow-steps">${FLOW.map((f,i)=>`<button class="fstep ${f.done()?'done':i===cur?'current':''}" data-act="flow" data-i="${i}"><span class="n">${f.done()?'✓':i+1}</span><span><span class="t">${esc(f.t)}</span><br><span class="w">${esc(PERSONAS[f.p].name)}</span></span></button>`).join('')}</div>
  </section>
  <div class="layout">
    <nav class="nav" aria-label="Main"><div class="who"><b>${esc(P.org)}</b><span>${esc(P.role)}</span></div>${nav}</nav>
    <main id="main">${(PAGES[S.page]||PAGES.reports)()}</main>
  </div>${drawerHtml()}`;
  window.scrollTo(0, scrollY);
}

/* ---------- actions ---------- */
function setPersona(p, page){ S.persona=p; S.page = page || NAV[p][0][0]; S.menu=null; S.drawer=null; }
const handlers = {
  go:(el)=>{ S.page=el.dataset.page; S.menu=null; window.scrollTo(0,0); },
  persona:(el)=>{ setPersona(el.dataset.p, el.dataset.page); window.scrollTo(0,0); },
  flow:(el)=>{ const f=FLOW[+el.dataset.i]; setPersona(f.p,f.page); window.scrollTo(0,0); },
  'toggle-persona':()=>{ S.menu = S.menu==='persona'?null:'persona'; },
  'toggle-notes':()=>{ S.menu = S.menu==='notes'?null:'notes'; },
  'mark-read':()=>{ S.notes.forEach(n=>{ if(n.to===S.persona) n.read=true; }); S.menu=null; },
  reset:()=>{ S.drawer={type:'confirm',title:'Reset demo data?',body:'This restores the August close to its starting point: one failed extract, 8 suspense items, a draft rate card and no statements.',ok:'Reset',act:'do-reset'}; S.menu=null; },
  'do-reset':()=>{ S = freshState(); toast('Demo reset to the start of the August close'); },
  rerun:(el)=>{ const r = S.runs.find(x=>x.id===el.dataset.id); r.status='Running'; r.err=null; render();
    setTimeout(()=>{ r.status='Success'; r.rec=24960; r.dur='00:09:37'; r.start='2026-09-26 '+NOW().slice(11); log('Integration','Extract re-run succeeded',r.id,'24,960 tracking events loaded for 31 Aug','admin'); notify('fin','All August extracts are complete.'); toast('RUN-24522 re-run succeeded · 24,960 records'); render(); }, 1400); return 'norender'; },
  resolve:(el)=>{ resolveItems([el.dataset.id]); },
  'resolve-all':()=>{ resolveItems(S.suspense.map(s=>s.id)); },
  'accept-high':()=>{ resolveItems(S.suspense.filter(s=>s.conf>=0.9).map(s=>s.id)); },
  sort:(el)=>{ S.filters.allocSort = el.dataset.k; },
  metric:(el)=>{ if(S.locked) return; S.rate.metric = el.dataset.k; if(S.rate.approved){ S.rate.approved=false; S.rate.version++; S.rate.draftFrom='v'+(S.rate.version-1); } log('Rate card','Metric changed','Rate card v'+S.rate.version,'Metric set to '+METRICS[el.dataset.k].label); },
  'approve-rate':()=>{ S.rate.approved=true; S.rate.approvedBy='Mark Ellison'; S.rate.approvedAt=NOW(); log('Rate card','Rate card approved','Rate card v'+S.rate.version,METRICS[S.rate.metric].label+', fixed share '+pct(S.rate.alpha,0)); toast('Rate card v'+S.rate.version+' approved'); },
  lock:()=>{ S.drawer={type:'confirm',title:'Lock August 2026?',body:'Locking freezes volumes, mapping results and rates for August into a snapshot. Later changes apply to September. This cannot be undone.',ok:'Lock period',act:'do-lock'}; },
  'do-lock':()=>{ S.drawer=null; S.locked=true; S.lockedAt=NOW(); S.snapshot={id:'SNAP-2026-08-'+Math.floor(4096+Math.random()*61439).toString(16).toUpperCase(),hash:'a7'+Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6),rows:42377}; log('Period','Period locked','2026-08','Snapshot '+S.snapshot.id+', allocated '+usd(allocate().allocated)); notify('aud','August 2026 locked as '+S.snapshot.id+'.'); toast('August 2026 locked · '+S.snapshot.id); },
  issue:()=>{ S.drawer={type:'confirm',title:'Issue 13 statements?',body:'Each bottler finance contact gets the August statement and can view it in the hub. The '+S.rate.window+'-day dispute window starts today.',ok:'Issue statements',act:'do-issue'}; },
  'do-issue':()=>{ S.drawer=null; S.issued=true; S.issuedAt=NOW(); log('Statements','Statements issued','2026-08','13 statements, '+usd(allocate().allocated)+' total'); notify('bot','Your August 2026 statement is ready: '+usd(bottlerStatement('B01').total)+'.'); notify('exec','August statements issued. 100% of '+usd0(totalCost())+' billed.'); toast('13 statements issued'); },
  'dispute-line':(el)=>{ S.drawer={type:'dispute-new',i:+el.dataset.i}; },
  'submit-dispute':()=>{ const st = bottlerStatement('B01'); const l = st.lines[S.drawer.i]; const claim = parseFloat($('#dclaim').value); const desc = $('#ddesc').value.trim();
    if(!(claim>0) || claim>l.amt){ toast('Enter an amount between $0.01 and '+usd(l.amt)); return 'norender'; } if(!desc){ toast('Describe what is wrong'); return 'norender'; }
    const id = 'DSP-0'+(143+S.disputes.filter(d=>d.period==='2026-08').length);
    S.disputes.unshift({id,bottler:'B01',period:'2026-08',line:l.line,reason:$('#dreason').value,desc,evidence:$('#devid').value,claimed:r2(claim),status:'Submitted',credit:0,raisedBy:'Dana Whitfield (B01)',raised:NOW().slice(0,10)});
    log('Disputes','Dispute raised',id,'B01 · '+l.line+' · '+usd(claim)); notify('fin','New dispute '+id+' from Great Lakes Bottling Co.: '+usd(claim)+'.'); S.drawer=null; S.page='mydisputes'; toast('Dispute '+id+' submitted'); },
  'open-dispute':(el)=>{ S.drawer={type:'dispute-view',id:el.dataset.id}; },
  decide:(el)=>{ const x = S.disputes.find(z=>z.id===S.drawer.id); const approve = el.dataset.v==='approve'; const credit = approve?r2(parseFloat($('#dcredit').value)||0):0; const note = $('#dnote').value.trim()||'—';
    if(approve && !(credit>0)){ toast('Enter a credit above $0'); return 'norender'; }
    Object.assign(x,{status:approve?'Approved':'Rejected',credit,decidedBy:'Mark Ellison',decided:NOW().slice(0,10),note});
    if(approve){ S.exclusions.push({id:'EX-0'+(S.exclusions.length+1),type:'Business partner',value:'TEST CARRIER 01',reason:'Test carrier (from '+x.id+')',vol:690,since:'2026-09-01'}); log('Attribution','Exclusion added','TEST CARRIER 01','From dispute '+x.id+', effective September','fin'); }
    log('Disputes',approve?'Dispute approved':'Dispute rejected',x.id,approve?'Credit '+usd(credit)+' carried to September':note); notify('bot','Dispute '+x.id+' '+(approve?'approved: '+usd(credit)+' credit on your September statement.':'rejected.')); notify('aud','Dispute '+x.id+' '+x.status.toLowerCase()+' by Mark Ellison.'); S.drawer=null; toast(x.id+' '+x.status.toLowerCase()); },
  close:()=>{ S.drawer=null; },
  'close-bg':(el,e)=>{ if(e.target===el) S.drawer=null; else return 'norender'; },
  auditcat:(el)=>{ S.filters.auditCat = el.dataset.k; },
  dl:(el)=>{ download(el.dataset.rep, el.dataset.fmt); return 'norender'; }
};
function resolveItems(ids){
  let n=0, rules=0;
  ids.forEach(id=>{ const i = S.suspense.findIndex(s=>s.id===id); if(i<0) return; const s = S.suspense.splice(i,1)[0]; s.by='Priya Raman'; s.at=NOW();
    if (s.saveRule){ const typ = s.key.startsWith('User')?'IAS user group':s.key.startsWith('Location')?'Location':s.key.startsWith('Company')?'Company code':'Business partner';
      const val = (s.key.match(/(BP-\d+|CC-\d+|LOC-[A-Z0-9-]+|[A-Z_]{4,})/)||[s.key])[0];
      s.rule = 'MR-0'+(170+S.rules.length); S.rules.push({id:s.rule,type:typ,value:val,bottler:s.assign,level:typ==='Location'?3:typ==='IAS user group'?2:1,from:'2026-08-01',ver:1,by:'Priya Raman'}); rules++; }
    S.resolved.push(s); n++;
    log('Attribution','Suspense resolved',s.id,s.fo+' orders → '+s.assign+(s.rule?' · rule '+s.rule:''),'admin'); });
  if (!S.suspense.length) notify('fin','Suspense cleared: 100% of August volume attributed.');
  toast(n+' item'+(n===1?'':'s')+' assigned'+(rules?' · '+rules+' mapping rule'+(rules===1?'':'s')+' created':''));
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el){ if(S.menu && !e.target.closest('.menu')){ S.menu=null; render(); } return; }
  const act = el.dataset.act; if (['sus-assign','sus-rule','alpha','repb'].includes(act)) return;
  if (el.tagName==='BUTTON' && el.disabled) return;
  const h = handlers[act]; if(!h) return; e.preventDefault();
  if (h(el,e)!=='norender') render();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && (S.drawer||S.menu)){ S.drawer=null; S.menu=null; render(); } if((e.key==='Enter'||e.key===' ') && e.target.matches('a[data-act]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e=>{
  const el = e.target; const act = el.dataset.act;
  if (act==='sus-assign'){ S.suspense.find(s=>s.id===el.dataset.id).assign = el.value; }
  if (act==='sus-rule'){ S.suspense.find(s=>s.id===el.dataset.id).saveRule = el.checked; }
  if (act==='repb'){ S.filters.repBottler = el.value; }
  if (act==='alpha'){ S.rate.alpha = (+el.value)/100; if(S.rate.approved){ S.rate.approved=false; S.rate.version++; S.rate.draftFrom='v'+(S.rate.version-1); } log('Rate card','Fixed share changed','Rate card v'+S.rate.version,'Alpha set to '+el.value+'%'); render(); }
});
document.addEventListener('input', e=>{ if(e.target.dataset.act==='alpha'){ const b = e.target.closest('.field').querySelector('label b'); if(b) b.textContent = e.target.value+'%'; } });
document.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.id==='ruleForm'){ const val = $('#rval').value.trim(); if(!val){ toast('Enter a key value'); return; }
    const typ = $('#rtype').value; const id='MR-0'+(170+S.rules.length); S.rules.push({id,type:typ,value:val,bottler:$('#rbot').value,level:typ==='Location'?3:typ==='IAS user group'?2:1,from:$('#rfrom').value,ver:1,by:PERSONAS[S.persona].name});
    log('Attribution','Mapping rule created',id,typ+' '+val+' → '+$('#rbot').value); toast('Rule '+id+' saved'); render(); }
});

render();
})();
</script>
</body></html>
